<text x="24" y="122" textLength="656.25" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7FB38A"># returns and settlement, and feeds measured profit back into the next decision.</tspan></text>
<text x="24" y="144" textLength="483.98" lengthAdjust="spacing" xml:space="preserve"><tspan fill="#7FB38A"># AI research is never allowed to invent a price or a cost.</tspan></text>
